<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hexfeed Admin - Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1b26;
    --surface: #24283b;
    --border: #3b4261;
    --text: #c0caf5;
    --text-dim: #565f89;
    --accent: #7aa2f7;
    --danger: #f7768e;
    --radius: 6px;
  }
  body {
    font-family: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 380px;
  }
  .login-box h1 {
    font-size: 1.2rem;
    margin-bottom: 0.25rem;
    font-weight: 600;
    color: var(--accent);
  }
  .login-box p.sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 1.5rem;
  }
  .login-box label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
  }
  .login-box input {
    width: 100%;
    padding: 0.55rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-box button {
    width: 100%;
    padding: 0.55rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .login-box button:hover { opacity: 0.85; }
  .login-box .error {
    background: rgba(247, 118, 142, 0.15);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 0.5rem 0.75rem;
    font-size: 0.78rem;
    margin-bottom: 1rem;
  }
  .login-box .info {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>hexfeed</h1>
  <p class="sub">Admin Panel</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <label for="password">Admin Password</label>
    <input type="password" id="password" name="password" placeholder="password" autofocus required>
    <button type="submit">Sign In</button>
  </form>
  <div class="info">Restricted to localhost (127.0.0.1:8001)</div>
</div>
</body>
</html>
