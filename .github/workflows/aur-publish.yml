name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.0)"
        required: true

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download tarball and compute checksum
        id: checksum
        run: |
          URL="https://github.com/${{ github.repository }}/archive/${{ steps.version.outputs.tag }}.tar.gz"
          curl -sL "$URL" -o /tmp/release.tar.gz
          SHA256=$(sha256sum /tmp/release.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking accept-new
            User git
          EOF

      - name: Clone or create AUR package
        run: |
          if git ls-remote ssh://aur@aur.archlinux.org/hexfeed.git &>/dev/null 2>&1; then
            git clone ssh://aur@aur.archlinux.org/hexfeed.git /tmp/aur-pkg
          else
            mkdir -p /tmp/aur-pkg
            cd /tmp/aur-pkg
            git init
            git remote add origin ssh://aur@aur.archlinux.org/hexfeed.git
          fi

      - name: Write PKGBUILD
        working-directory: /tmp/aur-pkg
        run: |
          cat > PKGBUILD << 'PKGEOF'
          # Maintainer: mistercookie <mistercookie@archlinux.org>
          # Contributor: MCookinho <mistercookie@archlinux.org>

          pkgname=hexfeed
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="Anonymous private social network. Tor-native, zero IP leaks, zero trackers."
          arch=('any')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=(
              'python>=3.11'
              'python-fastapi'
              'python-uvicorn'
              'python-textual'
              'python-httpx'
              'python-bcrypt'
              'python-pgpy'
              'python-stem'
              'python-multipart'
              'python-jinja'
          )
          optdepends=(
              'tor: for .onion hidden service support'
          )
          makedepends=('python-build' 'python-installer' 'python-wheel')
          source=("$pkgname-$pkgver.tar.gz::https://github.com/${{ github.repository }}/archive/${{ steps.version.outputs.tag }}.tar.gz")
          sha256sums=('${{ steps.checksum.outputs.sha256 }}')

          build() {
              cd "$srcdir/$pkgname-$pkgver"
              python -m build --wheel --no-isolation
          }

          package() {
              cd "$srcdir/$pkgname-$pkgver"
              python -m installer --destdir="$pkgdir" dist/*.whl
          }
          PKGEOF

      - name: Generate .SRCINFO
        working-directory: /tmp/aur-pkg
        run: |
          # Install pacman-contrib for makepkg if needed
          if ! command -v makepkg &>/dev/null; then
            sudo pacman-db-upgrade 2>/dev/null || true
          fi
          # Generate .SRCINFO by hand since makepkg may not be available
          cat > .SRCINFO << SRCEOF
          pkgbase = hexfeed
          pkgdesc = Anonymous private social network. Tor-native, zero IP leaks, zero trackers.
          pkgver = ${{ steps.version.outputs.version }}
          pkgrel = 1
          url = https://github.com/${{ github.repository }}
          arch = any
          license = MIT
          makedepends = python-build
          makedepends = python-installer
          makedepends = python-wheel
          depends = python>=3.11
          depends = python-fastapi
          depends = python-uvicorn
          depends = python-textual
          depends = python-httpx
          depends = python-bcrypt
          depends = python-pgpy
          depends = python-stem
          depends = python-multipart
          depends = python-jinja
          optdepends = tor: for .onion hidden service support
          source = hexfeed-${{ steps.version.outputs.version }}.tar.gz::https://github.com/${{ github.repository }}/archive/${{ steps.version.outputs.tag }}.tar.gz
          sha256sums = ${{ steps.checksum.outputs.sha256 }}

          pkgname = hexfeed
          SRCEOF

      - name: Commit and push to AUR
        working-directory: /tmp/aur-pkg
        run: |
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git -c user.name="MCookinho" -c user.email="mistercookie@archlinux.org" \
              commit -m "Update to v${{ steps.version.outputs.version }}"
            git push -u origin master
          else
            echo "No changes to commit"
          fi
